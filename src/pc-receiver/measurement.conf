db = /home/taranev/work_repos/rt-tester/merged.db
auto-stop-groups = 2500

# Measurement parameters
# 200-1500 measurements per group

measurements-per-group = 1500  
measurement-interval-us = 300

# Auto-calculated (shown for reference — not used if explicitly set):
#   worst-count = 5% of measurements-per-group
#   timeout-us = group_duration × 2
#   check-interval-us = group_duration

# Target device information
target-board = rockpi4
target-kernel = 6.12-rt
target-stress = on
target-payload = off  # on — payload between Arduino pulses, off — idle
