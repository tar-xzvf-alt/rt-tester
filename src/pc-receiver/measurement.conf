db = arduino.db
auto-stop-groups = 100

# Measurement parameters
measurements-per-group = 1500    # 200-1500 measurements per group
measurement-interval-us = 10000  # interval between measurements (µs)

# Auto-calculated (shown for reference — not used if explicitly set):
#   worst-count = 5% of measurements-per-group
#   timeout-us = group_duration × 2
#   check-interval-us = group_duration

# Target device information
target-board = repkapi4
target-kernel = 6.6.44
target-stress = off
