apiVersion: 1

deleteDatasources:
  - name: RT GPIO Prometheus
    orgId: 1
  - name: RT Trace Prometheus
    orgId: 1

datasources:
  - name: RT GPIO Prometheus
    uid: rt-gpio-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 500ms

  - name: RT Trace Prometheus
    uid: rt-trace-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 500ms
