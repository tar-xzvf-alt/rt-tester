# Stressed kernelspace GPIO session on the VisionFive 2 PREEMPT_RT kernel.

[stand]
name = visionfive2-rt-kernelspace-gpio-stressed
mode = standalone-gpio

[target]
host = root@10.42.0.211
label = visionfive2
execution-mode = kernelspace
board = starfive
module = rt_gpio_responder
module-args = board=starfive log_events=0
irq-name = rt-gpio-responder
rt-cpu = 1
gpio-irq-priority = 99
housekeeping-cpus = 0,3
expected-kernel = 6.18.18-rt-alt1.port.rv64

[measurement]
db = /home/taranev/.local/state/rt-tester/visionfive2-handler-comparison-rt/comparison.db
groups = 100
measurements-per-group = 1500
measurement-interval-us = 1000
response-timeout-us = 10000
arduino-port = /dev/ttyACM0
target-board = visionfive2-rt-kernelspace-stressed-v2
target-kernel = 6.18.18-rt-alt1.port.rv64
target-stress = on
target-payload = off

[stress]
command = stress-ng --cpu 4 --cpu-method int64 --vm 1 --vm-bytes 70% --vm-keep --timeout 0
warmup-seconds = 60
stability-samples = 6
stability-interval-seconds = 5
memory-stability-percent = 5
pid = /tmp/rt-gpio-stress.pid
log = /tmp/rt-gpio-stress.log

[observability]
remote-write-url = http://127.0.0.1:19090/api/v1/write
central-ssh-host = prometheus-writer@wetgrape.su
central-ssh-port = 228
central-ssh-identity = ~/.local/share/rt-tester/central_observability_ed25519
central-prometheus-local-port = 19090
central-grafana-local-port = 13000
central-tunnel-pid = ~/.local/state/rt-tester/central-observability-tunnel.pid
central-tunnel-log = ~/.local/state/rt-tester/central-observability-tunnel.log
grafana-managed = false
receiver-port = 9101
prometheus = prometheus
prometheus-port = 9092
prometheus-url = http://127.0.0.1:9092
prometheus-retention-time = 24h
prometheus-pid = /home/taranev/.local/state/rt-tester/visionfive2-handler-comparison-rt/prometheus.pid
prometheus-log = /home/taranev/.local/state/rt-tester/visionfive2-handler-comparison-rt/prometheus.log
prometheus-data = /home/taranev/.local/state/rt-tester/visionfive2-handler-comparison-rt/prometheus
prometheus-config = /home/taranev/.local/state/rt-tester/visionfive2-handler-comparison-rt/prometheus.yml
node-exporter-target = 10.42.0.211:9100
grafana = grafana-server
grafana-port = 3002
grafana-pid = /home/taranev/.local/state/rt-tester/visionfive2-handler-comparison-rt/grafana.pid
grafana-log = /home/taranev/.local/state/rt-tester/visionfive2-handler-comparison-rt/grafana.log
grafana-data = /home/taranev/.local/state/rt-tester/visionfive2-handler-comparison-rt/grafana
grafana-url = http://127.0.0.1:13000/d/rt-standalone-gpio
