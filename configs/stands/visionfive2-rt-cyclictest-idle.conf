# Short prototype cyclictest run on all VisionFive 2 CPUs.

[stand]
name = visionfive2-rt-cyclictest-idle
mode = linux-benchmark

[target]
host = root@10.42.0.211
label = visionfive2
expected-kernel = 6.18.18-rt-alt1.port.rv64

[benchmark]
engine = cyclictest
binary = /usr/bin/cyclictest
profile = all-cpu-default-system
duration = 10
interval-us = 1000
distance-us = 0
histogram-max-us = 10000
policy = fifo
priority = 95
default-system = true
mlockall = true

[workload]
engine = idle

[results]
output-root = /home/taranev/.local/state/rt-tester/cyclictest-prototype

[publish]
host = root@wetgrape.su
port = 228
remote-directory = /tmp/rt-tester-cyclictest-publish
importer = /usr/bin/rt-results-import-cyclictest
database = /var/lib/rt-results-prototype/cyclictest.db
state-directory = ~/.local/state/rt-tester/cyclictest-publish
