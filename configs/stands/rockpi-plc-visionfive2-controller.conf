# Standard supervised raw-Ethernet stand:
# rockpi runs Beremiz + alt-rt-supervisor, visionfive2 runs GPIO controller.

[stand]
name = rockpi-plc-visionfive2-controller

[pc]
rt-supervisor-local = /home/taranev/work_repos/rt/rt-supervisor
network-check = /home/taranev/work_repos/rt/rt-supervisor/scripts/check_pc_network.sh

[supervisor]
host = root@10.43.0.2
board = rockpi4
iface = end0
repo = /usr/share/rt-supervisor
binary = /usr/bin/alt-rt-supervisor
stand-config = configs/stand/supervised-rockpi4.conf
# Provided by the matching rt-supervisor-runtime-example target package.
runtime = /usr/bin/runtime
timeout-us = 30000000
trace-path = /tmp/rt-supervisor-rockpi.jsonl
log-path = /tmp/rt-supervisor-rockpi.log
pid-path = /tmp/rt-supervisor-rockpi.pid
trace-exporter-log = /tmp/rt-supervisor-trace-exporter.log
trace-exporter-pid = /tmp/rt-supervisor-trace-exporter.pid
trace-target = 10.43.0.2:9201

[controller]
host = root@10.42.0.211
board = visionfive2
iface = end0
repo = /usr/share/rt-controller
binary = /usr/bin/controller-emu
stand-config = configs/stand/controller-visionfive2.conf
trace-path = /tmp/controller-visionfive2.jsonl
log-path = /tmp/controller-visionfive2.log
pid-path = /tmp/controller-visionfive2.pid
trace-exporter-log = /tmp/controller-trace-exporter.log
trace-exporter-pid = /tmp/controller-trace-exporter.pid
trace-target = 10.43.0.1:9201

[measurement]
db = /tmp/rt-tester-rockpi-visionfive2.db
groups = 100
measurements-per-group = 100
measurement-interval-us = 100000
target-board = rockpi4-supervised-visionfive2-controller
target-kernel = rockpi-6.12.90-rt-alt1
target-stress = off
target-payload = on

[stress]
runtime-command = stress-ng --cpu 0 --vm 0 --vm-bytes 85% --timeout 0
runtime-pid = /tmp/rt-runtime-stress.pid
runtime-log = /tmp/rt-runtime-stress.log

[transport]
packet-batch-size = 4
packet-batch-gap-us = 200
response-timeout-ms = 100

[observability]
remote-write-url = http://127.0.0.1:19090/api/v1/write
central-ssh-host = prometheus-writer@wetgrape.su
central-ssh-port = 228
central-ssh-identity = ~/.local/share/rt-tester/central_observability_ed25519
central-prometheus-local-port = 19090
central-grafana-local-port = 13000
central-tunnel-pid = ~/.local/state/rt-tester/central-observability-tunnel.pid
central-tunnel-log = ~/.local/state/rt-tester/central-observability-tunnel.log
grafana-managed = false
receiver-port = 9101
trace-exporter-port = 9201
prometheus = prometheus
prometheus-port = 9091
prometheus-pid = /tmp/rt-stand-prometheus-rockpi-visionfive2.pid
prometheus-log = /tmp/rt-stand-prometheus-rockpi-visionfive2.log
prometheus-data = /tmp/rt-stand-prometheus-rockpi-visionfive2-data
prometheus-config = /tmp/rt-stand-prometheus-rockpi-visionfive2.yml
grafana = grafana-server
grafana-port = 3001
grafana-pid = /tmp/rt-stand-grafana-rockpi-visionfive2.pid
grafana-log = /tmp/rt-stand-grafana-rockpi-visionfive2.log
grafana-data = /tmp/rt-stand-grafana-rockpi-visionfive2-data
grafana-url = http://127.0.0.1:13000/d/rt-trace-stages
