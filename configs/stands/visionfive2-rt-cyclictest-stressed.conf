# Short prototype cyclictest run under CPU and memory stress.

[stand]
name = visionfive2-rt-cyclictest-stressed
mode = linux-benchmark

[target]
host = root@10.42.0.211
label = visionfive2
expected-kernel = 6.18.18-rt-alt1.port.rv64

[benchmark]
engine = cyclictest
binary = /usr/bin/cyclictest
profile = all-cpu-default-system
duration = 10
interval-us = 1000
distance-us = 0
histogram-max-us = 10000
policy = fifo
priority = 95
default-system = true
mlockall = true

[workload]
engine = stress-ng
command = stress-ng --cpu 4 --cpu-method int64 --vm 1 --vm-bytes 70% --vm-keep --timeout 0
warmup-seconds = 5

[results]
output-root = /home/taranev/.local/state/rt-tester/cyclictest-prototype
