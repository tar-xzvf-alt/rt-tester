# Standalone GPIO stand:
# visionfive2 runs rt-handler and answers Arduino GPIO pulses directly.

[stand]
name = visionfive2-standalone-gpio
mode = standalone-gpio

[target]
host = root@10.42.0.211
label = visionfive2
# Current rt-handler board profile name for VisionFive 2.
board = starfive
binary = /usr/sbin/rt-handler
args = -b {board}
workdir = /
# Only needed with --deploy/--build source-tree updates.
rt-handler-local = /home/taranev/work_repos/rt/rt-handler
repo = /root/rt-handler
pid-path = /tmp/rt-handler-visionfive2.pid
stdout-log = /tmp/rt-handler-visionfive2.log
# rt-handler's metrics file format is legacy; do not persist or import it.
metrics-log = /dev/null
housekeeping-cpus = 0

[measurement]
db = /tmp/rt-tester-visionfive2-gpio.db
groups = 100
measurements-per-group = 100
measurement-interval-us = 100000
target-board = visionfive2-standalone-gpio
target-kernel = visionfive2
target-stress = off
target-payload = on

[stress]
command = stress-ng --cpu 0 --vm 0 --vm-bytes 85% --timeout 0
pid = /tmp/rt-gpio-stress.pid
log = /tmp/rt-gpio-stress.log

[observability]
receiver-port = 9101
prometheus = prometheus
prometheus-port = 9092
prometheus-url = http://127.0.0.1:9092
prometheus-pid = /tmp/rt-gpio-prometheus-visionfive2.pid
prometheus-log = /tmp/rt-gpio-prometheus-visionfive2.log
prometheus-data = /tmp/rt-gpio-prometheus-visionfive2-data
prometheus-config = /tmp/rt-gpio-prometheus-visionfive2.yml
node-exporter-target = 10.42.0.211:9100
grafana = grafana-server
grafana-port = 3002
grafana-pid = /tmp/rt-gpio-grafana-visionfive2.pid
grafana-log = /tmp/rt-gpio-grafana-visionfive2.log
grafana-data = /tmp/rt-gpio-grafana-visionfive2-data
grafana-url = http://127.0.0.1:3002/d/rt-standalone-gpio
