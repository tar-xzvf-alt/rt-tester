# Reference userspace GPIO experiment. Copy and adapt before running.
# Replace TARGET_HOST and TARGET_KERNEL; normalize .rt-tester-example paths
# to absolute paths as described in docs/usage/standalone-gpio-walkthrough.md.
# Basic invocation REQUIRES --no-prometheus --no-grafana.
[stand]
name = visionfive2-gpio-example
mode = standalone-gpio

[target]
host = root@TARGET_HOST
label = visionfive2
board = starfive
execution-mode = userspace
expected-kernel = TARGET_KERNEL
binary = /usr/sbin/rt-handler
args = -b {board}
workdir = /
pid-path = /tmp/rt-handler-gpio-example.pid
stdout-log = /tmp/rt-handler-gpio-example.log
irq-name = starfive-monitor
rt-cpu = 1
handler-priority = 85
gpio-irq-priority = 99
housekeeping-cpus = 0,3
metrics-log = /dev/null

[measurement]
db = .rt-tester-example/gpio.db
groups = 100
measurements-per-group = 1500
measurement-interval-us = 1000
response-timeout-us = 10000
target-board = visionfive2
target-kernel = TARGET_KERNEL
target-stress = off
target-payload = off
# Blank means automatic serial discovery. Set the actual port when ambiguous.
arduino-port =
arduino-baud = 115200

[stress]
command = stress-ng --cpu 4 --cpu-method int64 --vm 1 --vm-bytes 70% --vm-keep --timeout 0
pid = /tmp/rt-gpio-example-stress.pid
log = /tmp/rt-gpio-example-stress.log

[observability]
remote-write-url =
collector-label = my-measurement-pc
receiver-port = 9101
prometheus = prometheus
prometheus-port = 9092
prometheus-url = http://127.0.0.1:9092
prometheus-pid = .rt-tester-example/prometheus.pid
prometheus-log = .rt-tester-example/prometheus.log
prometheus-data = .rt-tester-example/prometheus-data
prometheus-config = .rt-tester-example/prometheus.yml
node-exporter-target = TARGET_HOST:9100
grafana-managed = false
grafana-url =
