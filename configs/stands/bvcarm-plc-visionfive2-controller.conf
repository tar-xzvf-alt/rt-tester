# Standard supervised raw-Ethernet stand:
# bvcarm runs the stub runtime + alt-rt-supervisor, visionfive2 runs GPIO controller.

[stand]
name = bvcarm-plc-visionfive2-controller

[pc]
rt-supervisor-local = /home/taranev/work_repos/rt/rt-supervisor
network-check = /home/taranev/work_repos/rt/rt-supervisor/scripts/check_pc_network.sh

[supervisor]
host = root@10.43.0.2
board = bvc_arm
iface = enp4s0
repo = /root/rt-supervisor
build = Build-verify-bvc_arm
stand-config = configs/stand/supervised-bvc-arm.conf
runtime = /root/rt-supervisor/Build-verify-bvc_arm/src/runtime
timeout-us = 30000000
trace-path = /tmp/rt-supervisor-bvcarm.jsonl
log-path = /tmp/rt-supervisor-bvcarm.log
pid-path = /tmp/rt-supervisor-bvcarm.pid
trace-exporter-log = /tmp/rt-supervisor-trace-exporter.log
trace-exporter-pid = /tmp/rt-supervisor-trace-exporter.pid
trace-target = 10.43.0.2:9201

[controller]
host = root@10.42.0.211
board = visionfive2
iface = end0
repo = /root/rt-controller
build = Build-verify-visionfive2
stand-config = configs/stand/controller-visionfive2.conf
trace-path = /tmp/controller-visionfive2.jsonl
log-path = /tmp/controller-visionfive2.log
pid-path = /tmp/controller-visionfive2.pid
trace-exporter-log = /tmp/controller-trace-exporter.log
trace-exporter-pid = /tmp/controller-trace-exporter.pid
trace-target = 10.43.0.1:9201

[measurement]
db = /tmp/rt-tester-bvcarm-visionfive2.db
groups = 100
measurements-per-group = 100
measurement-interval-us = 100000
target-board = bvcarm-supervised-visionfive2-controller
target-kernel = bvcarm-5.10.210-elbrus-def-alt1.19.2
target-stress = off
target-payload = on

[stress]
runtime-command = taskset -c 0 stress-ng --cpu 0 --vm 0 --vm-bytes 85% --timeout 0
runtime-pid = /tmp/rt-runtime-stress.pid
runtime-log = /tmp/rt-runtime-stress.log

[transport]
packet-batch-size = 4
packet-batch-gap-us = 200
response-timeout-ms = 100

[observability]
receiver-port = 9101
trace-exporter-port = 9201
prometheus = prometheus
prometheus-port = 9091
prometheus-pid = /tmp/rt-stand-prometheus-bvcarm-visionfive2.pid
prometheus-log = /tmp/rt-stand-prometheus-bvcarm-visionfive2.log
prometheus-data = /tmp/rt-stand-prometheus-bvcarm-visionfive2-data
prometheus-config = /tmp/rt-stand-prometheus-bvcarm-visionfive2.yml
grafana = grafana-server
grafana-port = 3001
grafana-pid = /tmp/rt-stand-grafana-bvcarm-visionfive2.pid
grafana-log = /tmp/rt-stand-grafana-bvcarm-visionfive2.log
grafana-data = /tmp/rt-stand-grafana-bvcarm-visionfive2-data
grafana-url = http://127.0.0.1:3001/d/rt-trace-stages
