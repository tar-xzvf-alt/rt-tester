global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'rt-tester'

scrape_configs:
  - job_name: 'radxa'
    static_configs:
      - targets: ['192.168.0.223:9100']
        labels:
          board: 'radxa'
          location: 'lab'
          
  - job_name: 'arduino_latency'
    static_configs:
      - targets: ['localhost:9101']
        labels:
          source: 'pc-receiver'