global:
  scrape_interval: 500ms
  evaluation_interval: 15s
  external_labels:
    monitor: 'rt-tester'

scrape_configs:
  - job_name: 'radxa_node'
    scrape_interval: 500ms
    static_configs:
      - targets: ['192.168.0.223:9100']
        labels:
          board: 'radxa'
          source: 'node_exporter'
          
  - job_name: 'arduino_latency'
    scrape_interval: 500ms
    static_configs:
      - targets: ['localhost:9101']
        labels:
          source: 'pc-receiver'