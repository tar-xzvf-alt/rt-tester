global:
  scrape_interval: 500ms
  evaluation_interval: 15s
  external_labels:
    monitor: 'rt-tester-trace-local-tunnel'

scrape_configs:
  - job_name: 'arduino_latency'
    scrape_interval: 500ms
    static_configs:
      - targets: ['localhost:9101']
        labels:
          source: 'pc-receiver'

  # Tunnel to supervisor trace exporter (19201 → supervisor:9201)
  - job_name: 'rt_trace_supervisor'
    scrape_interval: 500ms
    static_configs:
      - targets: ['127.0.0.1:19201']
        labels:
          source: 'rt-trace-exporter'
