global:
  scrape_interval: 500ms
  evaluation_interval: 15s
  external_labels:
    monitor: 'rt-tester-trace-local-tunnel'

scrape_configs:
  - job_name: 'arduino_latency'
    scrape_interval: 500ms
    static_configs:
      - targets: ['localhost:9101']
        labels:
          source: 'pc-receiver'

  # Create tunnels before starting Prometheus:
  #   ssh -f -N -L 19201:127.0.0.1:9201 root@10.42.0.211
  #   ssh -f -N -L 19202:10.43.0.2:9201 root@10.42.0.211
  - job_name: 'rt_trace_visionfive'
    scrape_interval: 500ms
    static_configs:
      - targets: ['127.0.0.1:19201']
        labels:
          board: 'visionfive'
          source: 'rt-trace-exporter'

  - job_name: 'rt_trace_rockpi'
    scrape_interval: 500ms
    static_configs:
      - targets: ['127.0.0.1:19202']
        labels:
          board: 'rockpi'
          source: 'rt-trace-exporter'
